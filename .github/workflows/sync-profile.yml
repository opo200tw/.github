name: Sync Organization Profile README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Repos and Generate README
        env:
          # 優先使用具有讀取私有 Repo 權限的 ORG_TOKEN，若無則降級使用 GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh repo list opo200tw --limit 100 --json name,description,isArchived,isFork,url > repos.json
          python3 generate_readme.py repos.json

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md profile/README.md
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(auto): update profile README from repository changes"
            git push
          fi
